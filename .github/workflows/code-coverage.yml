name: Code Coverage

on:
  pull_request:
    branches: [ main, develop, feature/l1conv ]
  push:
    branches: [ develop, feature/l1conv ]

permissions:
  contents: write
  issues: write

jobs:
  execute-unit-code-coverage-report-on-release:
    name: Test coverage report for release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests with coverage flags enabled
        run: |
          sh run_ut.sh --enable-cov
      - name: Generate L1_Coverage.md
        run: |
          python3 test/functional-tests/generate_l1_coverage_report.py \
            --lcov-file src/unittest/coverage.info \
            --gtest-json /tmp/Gtest_Report/rdkRemoteDebugger_gtest_report.json \
            --source-dir src \
            --output test/functional-tests/L1_Coverage.md
      - name: Caculate the code coverage summary
        run: |
          cd ./src/unittest
          lcov --list coverage.info | grep "Lines\|Total" > /tmp/coverage_summary.txt
          cd -
        
      - name: Update the coverage report to Pull request using actions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v4
        with:
          script: |
            const fs = require('fs');
            const lcov_result = fs.readFileSync('/tmp/coverage_summary.txt', 'utf8'); 
          
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 
                    '## Code Coverage Summary \n' +
                    ' ' +
                    '```' +
                    lcov_result + 
                    '```'
            });
      - name: Generate the html report
        run: |
          cd ./src/unittest
          genhtml coverage.info --output-directory /tmp/coverage_report
          cd -
      - name: Upload the coverage report to Pull request using actions
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: /tmp/coverage_report
      - name: Upload L1_Coverage.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: L1_Coverage
          path: test/functional-tests/L1_Coverage.md
      - name: Commit L1_Coverage.md
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
          cp test/functional-tests/L1_Coverage.md /tmp/L1_Coverage.md
          # Re-sync with the latest remote branch so the push is a fast-forward
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git checkout -f -B "$BRANCH" "origin/$BRANCH"
            cp /tmp/L1_Coverage.md test/functional-tests/L1_Coverage.md
            git add test/functional-tests/L1_Coverage.md
            git diff --cached --quiet && exit 0
            git commit -m "ci: regenerate L1_Coverage.md [skip ci]"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
